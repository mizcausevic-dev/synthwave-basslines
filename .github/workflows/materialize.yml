name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge gh-pages and push
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git fetch origin gh-pages
          git merge origin/gh-pages -m "Merge gh-pages into the corrected catalog [skip ci]"
          git push origin HEAD:main
          git push origin HEAD:gh-pages
