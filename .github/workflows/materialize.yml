name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          curl -fsSL -o source.tar.gz "https://h.uguu.se/tdatOHRM.tar.gz"
          echo "49d70a724f317a43308df760486e92d5d6eb7537960d54818f26b9a4540a37b9  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Enable GitHub Pages on gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o pages-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "pages_http_${code}"
          python3 -c "print(open('pages-response.json').read()[:700])"
          rm -f pages-response.json
          if [ "$code" != "201" ] && [ "$code" != "409" ] && [ "$code" != "200" ]; then
            exit 1
          fi
      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no file changes"
          else
            git commit -m "Materialize Synthwave Basslines [skip ci]"
            git push
            git push origin HEAD:gh-pages
          fi
